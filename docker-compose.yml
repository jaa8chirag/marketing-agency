services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cordinit
      POSTGRES_PASSWORD: cordinit_dev_password
      POSTGRES_DB: cordinit_media
    ports:
      - "5434:5432"
    volumes:
      - cordinit_pgdata:/var/lib/postgresql/data

volumes:
  cordinit_pgdata:
